<!doctype html>
<html lang="es">
<head>

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>html,body{background:#f3f5f8;margin:0}html[data-theme=dark],html[data-theme=dark] body{background:#0b1220}</style>

<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-board" viewBox="0 0 24 24">

      <path d="M12 9v4"/>
      <path d="M12 17h.01"/>

      <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.2 3.1M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/>
