# Un solo contenedor: API + interfaz en http://localhost:4010.
# La base SQLite, las fotos y los PDF quedan en el volumen "fallas_data" (sobreviven a reconstrucciones).
services:
  app:
    build: .
    environment:
      # Contraseña inicial del usuario "admin" (se pide cambiarla en el primer ingreso).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
    volumes:
      - fallas_data:/data
    ports:
      - "4010:4010"
    restart: unless-stopped
volumes:
  fallas_data:
